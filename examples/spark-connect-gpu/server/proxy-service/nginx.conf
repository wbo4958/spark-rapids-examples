events {
    worker_connections 1024;
}

http {
    # Needed for the port 2080 proxy when using variables in proxy_pass
    resolver 127.0.0.11 ipv6=off;

    server {
        listen 2080;

        location / {
            proxy_set_header        Host              $http_host;
            proxy_set_header        X-Real-IP         $remote_addr;
            proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto $scheme;
            proxy_pass              $scheme://$http_host;
            proxy_read_timeout      90;
        }
    }

    # ------------------------------------------------------------------
    # Simple Bearer token validation for Spark Connect (gRPC over HTTPS)
    # ------------------------------------------------------------------
    map $http_authorization $is_authorized {
        default                             0;
        # Replace this line with real OIDC validation later
        "Bearer spark-secret-token"         1;
        "~^Bearer "                         0;  # any other Bearer token → denied
    }

    # ------------------------------------------------------------------
    # Spark Connect server (HTTPS + gRPC) on port 443
    # ------------------------------------------------------------------
    server {
        listen       0.0.0.0:443 ssl http2;
        listen       [::]:443 ssl http2;
        server_name  _;

        # SSL certificates (replace with your real ones or Let's Encrypt)
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # Large Arrow batches from Spark 4.0+
        client_max_body_size 100m;
        grpc_read_timeout    300s;

        location / {
            # Enforce authentication
            if ($is_authorized = 0) {
                add_header Content-Type application/json;
                return 401 '{"error": "Unauthorized: Missing or invalid token"}';
            }

            # Forward gRPC traffic to Spark Connect server
            grpc_pass grpc://spark-connect-server:15002;

            # Optional: forward client IP
            grpc_set_header X-Real-IP $remote_addr;
        }
    }
}