events {
    worker_connections 1024;
}

http {
    # Needed for the port 2080 proxy when using variables in proxy_pass
    resolver 127.0.0.11 ipv6=off;

    server {
        listen 2080;

        location / {
            proxy_set_header        Host              $http_host;
            proxy_set_header        X-Real-IP         $remote_addr;
            proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto $scheme;
            proxy_pass              $scheme://$http_host;
            proxy_read_timeout      90;
        }
    }

    # ------------------------------------------------------------------
    # Simple Bearer token validation for Spark Connect (gRPC over HTTPS)
    # ------------------------------------------------------------------
    map $http_authorization $is_authorized {
        default                             0;
        # Replace this line with real OIDC validation later
        "Bearer spark-secret-token"         1;
        "~^Bearer "                         0;  # any other Bearer token → denied
    }

    map $http_cluster_id $spark_backend {
        # If cluster_id is 'abc', route here
        "gpu"       grpc://spark-connect-server:15002;

        # If cluster_id is 'efg', route here
        "cpu"       grpc://spark-connect-server-cpu:15002;

        # Default fallback if header is missing or unknown
        default     grpc://spark-connect-server:15002;
    }

    log_format grpc_debug '$remote_addr - [$time_local] "$request" $status '
                              '--- HEADERS --- '
                              'ClusterID: "$http_cluster_id" '
                              'Auth: "$http_authorization" '
                              'Content-Type: "$http_content_type" '
                              'User-Agent: "$http_user_agent" '
                              'Spark-User: "$http_x_spark_user" '
                              'Spark-Trace-Id: "$http_x_spark_trace_id" '
                              'Accept-Encoding: "$http_grpc_accept_encoding" '
                              'SSL-Protocol: "$ssl_protocol"';
    # ------------------------------------------------------------------
    # Spark Connect server (HTTPS + gRPC) on port 443
    # ------------------------------------------------------------------
    server {
        listen       0.0.0.0:443 ssl http2;
        listen       [::]:443 ssl http2;
        server_name  _;

        # SSL certificates (replace with your real ones or Let's Encrypt)
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # Large Arrow batches from Spark 4.0+
        client_max_body_size 100m;
        grpc_read_timeout    300s;
        access_log /dev/stdout grpc_debug;
        # 3. Direct error logs to Docker's standard error
        error_log /dev/stderr warn;
        underscores_in_headers on;
        location / {
            # Enforce authentication
            if ($is_authorized = 0) {
                add_header Content-Type application/json;
                return 401 '{"error": "Unauthorized: Missing or invalid token"}';
            }

            # Forward gRPC traffic to Spark Connect server
#             grpc_pass grpc://spark-connect-server:15002;
             grpc_pass $spark_backend;

            # Optional: forward client IP
            grpc_set_header X-Real-IP $remote_addr;
        }
    }
}